<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>prairie-live mapping</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>prairie-live mapping</h1>
    <span class="sub">live FOV · per-power grid</span>
  </header>

  <section class="stage">
    <div id="fov_grid" class="fov-grid">
      <div class="tile" id="tile_live">
        <h3>Live scan</h3>
        <div class="fov-wrap">
          <img id="live_img" alt="live FOV" />
          <svg id="live_marks" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1 1"></svg>
          <button type="button" id="marks_toggle" class="fov-toggle" aria-pressed="true" title="Hide Mark Points overlay">MP</button>
        </div>
        <p id="live_cap" class="muted">connecting to relay…</p>
        <p id="marks_note" class="muted"></p>
      </div>
    </div>
  </section>

  <aside class="side" id="side">
  <section class="card rig-card">
    <h2>Rig</h2>
    <div class="row">
      <label>Relay IP <input id="via_relay" type="text" /></label>
      <span id="light" class="light off" title="relay / PrairieView"></span>
    </div>
    <p id="relay_detail" class="muted small">checking…</p>
    <div class="row">
      <label>Serial <select id="serial"></select></label>
      <label>Stim mode <select id="stim_mode"></select></label>
      <label title="serial: PV waits for the COM DTR pulse on PFI1. none: PV fires immediately.">Trigger <select id="trigger"></select></label>
    </div>
  </section>

  <section class="card session-card">
    <h2>Session</h2>
    <label>Fat Mark Points XML
      <input id="xml_file" type="file" accept=".xml,.gpl" />
    </label>
    <p id="xml_path" class="muted"></p>
    <label>Powers
      <input id="powers" type="text" placeholder="e.g. 160 or 75,140,200" />
    </label>
    <div class="row">
      <label>Seed <input id="seed" type="number" /></label>
      <label>Repetitions <input id="repetitions" type="number" /></label>
      <label>Stim ΔF/F min <input id="stim_dff_min" type="number" step="0.01" /></label>
    </div>
    <p id="plan" class="plan"></p>
    <div class="row">
      <button id="run" type="button">Run</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
  </section>

  <section class="card xml-card">
    <h2>From Fat XML</h2>
    <p id="fov_note" class="muted"></p>
    <dl id="xml_fields" class="fields"></dl>
  </section>

  <section class="card log-card">
    <h2>Trial log</h2>
    <pre id="log"></pre>
  </section>

  <section class="card" id="cand_box" hidden>
    <h2>Candidates</h2>
    <p class="muted">Click rows to toggle. Top third starts selected.</p>
    <div class="table-wrap">
    <table id="cand_table">
      <thead>
        <tr><th></th><th>id</th><th>min power</th><th>ΔF/F</th><th>tercile</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    </div>
    <div class="row">
      <button id="sel_top" type="button">Select top third</button>
      <button id="sel_clear" type="button">Clear</button>
      <button id="save_xml" type="button">Save XML</button>
    </div>
    <p id="save_status" class="muted"></p>
  </section>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
