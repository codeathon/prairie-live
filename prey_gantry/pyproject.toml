[project]
name = "prey-gantry"
version = "0.1.0"
description = "Timed hunt simulation: pylon-track arena + Basler delay model + Zaber XY API"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.32",
	"pydantic>=2.0",
]

[project.optional-dependencies]
zaber = ["zaber-motion>=7.0"]
dev = ["pytest>=8.0"]

[project.scripts]
prey-gantry-sim = "prey_gantry.web.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prey_gantry = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
